<body>
    <div class="content">
        <header>
            <nav class="site-nav" aria-label="Main">
                <a class="brand" href="home.html"><img src="../logo.svg" alt="Jenny Ed"></a>
                <ul>
                    <li><a class="is-current" href="home.html">Home</a></li>

        <div class="main">
            <h1 id="goback">Welcome</h1>
            <p id="sent-note" hidden></p>
            <p>Hello. I am Jenny Ed.</p>
            <p><strong>Mission.</strong> I keep a small place for the work I actually make: the garden at liyigarden, the story of Lii, and a way to reach me.</p>

    <p class="bg-credit">背景图来自游戏：<a href="https://key.visualarts.gr.jp/kinetic/stella/">星之终途</a></p>
    <script>
        var sentNote = document.getElementById("sent-note");
        if (new URLSearchParams(window.location.search).get("sent") === "1") {
            var savedMessage = sessionStorage.getItem("contactSubmission");
            var senderName = "";
            if (savedMessage) {
                senderName = JSON.parse(savedMessage).firstName || "";
            }
            sentNote.textContent = senderName
                ? "Thanks, " + senderName + ". Your message was kept, and you are back on the home page."
                : "Thanks. Your message was kept, and you are back on the home page.";
            sentNote.hidden = false;
        }
    </script>
